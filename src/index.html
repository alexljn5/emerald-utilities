<!DOCTYPE html>
<html>

<head>
    <title>Emerald Utilities</title>
    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="app">
        <!-- LEFT PANEL -->
        <div class="leftPanel">
            <!-- Header -->
            <div id="friedEggs">
                <h1>Emerald Utilities</h1>
                <span id="versionDisplay"></span>
                <div id="logo">
                    <img src="../img/favicons/favicon.png" alt="Logo" width="64" height="64">
                </div>
            </div>

            <!-- Navigation Box -->
            <div class="navBox">
                <h2>Navigation</h2>
                <div class="navButtons">
                    <button id="scriptToolButton" class="nav-btn full">Script Tool</button>
                    <button id="networkMonitorButton" class="nav-btn full">Network Monitor</button>
                    <button id="aboutButton" class="nav-btn full">About</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (Dashboard + Terminal) -->
        <div class="rightPanel">
            <div class="dashboardContent">
                <div class="backGroundSigil">
                    <img id="backGroundSigil_1" src="../img/backgrounds/sigil_1.png">
                </div>
                <!-- Terminal -->
                <div id="terminalOutput" class="dashboardTerminal"></div>
            </div>

            <!-- Mascot (small decorative) -->
            <div id="dashboardMascotImage">
                <img id="dashboardMascot" src="../img/mascot/dashboardMascotNeutral.png">
            </div>
        </div>
    </div>

    <script type="module" src="globals.js"></script>
    <script src="mascot/mascotMoodChanger.js"></script>
    <script type="module" src="pages/js/index.js"></script>
</body>

</html>
