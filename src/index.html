<!DOCTYPE html>
<html>

<head>
    <title>Emerald Utilities</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="friedEggs">
        <h1>Emerald Utilities</h1>
        <div id="logo">
            <img src="../img/favicons/favicon.png" alt="Emerald Utilities Logo" width="64" height="64">
        </div>
    </div>
    <div class="header-container">
        <div id="terminalOutput"></div>
    </div>

    <div class="moveElementsNextToTerminal">
        <div class="script">
            <button id="chooseScriptLocationButton">Choose Custom Scripts Folder</button>
        </div>
        <div id="scriptList"></div>
        <button id="loadScriptsButton">Load Scripts</button>
        <button id="saveScriptButton">Save Script</button>
        <h3>Script Content:</h3>
        <textarea id="scriptContent"></textarea><br>
        <h3>Run with Arguments:</h3>
        <input id="argsInput" type="text" placeholder="Enter arguments (e.g., input.txt)">
    </div>
    <script src="renderer.js"></script>
</body>

</html>
