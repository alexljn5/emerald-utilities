<!DOCTYPE html>
<html>

<head>
    <title>Emerald Utilities - Script Tool</title>
    <link rel="stylesheet" href="../css/globals.css">
    <link rel="stylesheet" href="../css/script_tool.css">
</head>

<body>

    <div class="app">

        <!-- LEFT PANEL -->
        <div class="leftPanel">

            <div id="friedEggs">
                <h1>Emerald Utilities</h1>
                <span id="versionDisplay"></span>
                <div id="logo">
                    <img src="../../img/favicons/favicon.png" alt="Logo" width="64" height="64">
                </div>
                <button id="aboutButton" style="margin-left: auto;">ⓘ About</button>
            </div>

            <a href="../index.html">
                <button>← Back</button>
            </a>

            <script>
                document.getElementById('scriptToolButton').addEventListener('click', () => {
                    window.location.href = './pages/script_tool.html';
                });

                document.getElementById('aboutButton').addEventListener('click', () => {
                    window.location.href = './pages/about.html';
                });
            </script>


            <!-- About Modal – placed outside .app to avoid layout issues -->
            <div id="aboutModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div id="aboutModalBody"></div>
                </div>
            </div>

            <button id="chooseScriptLocationButton">Choose Custom Scripts Folder</button>

            <div id="scriptList"></div>

            <button id="loadScriptsButton">Load Scripts</button>
            <button id="saveScriptButton">Save Script</button>

            <h3>Run with Arguments:</h3>
            <input id="argsInput" type="text" placeholder="Enter arguments">

            <h3>Script Content:</h3>
            <textarea id="scriptContent"></textarea>

        </div>

        <!-- RIGHT PANEL -->
        <div class="rightPanel">
            <div id="terminalOutput"></div>
        </div>

    </div>


    <script src="script_tool.js"></script>
</body>

</html>
